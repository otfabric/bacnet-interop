# Called by pr.yml on every pull request that is not documentation only;
# dispatch it to run it on a branch without a pull request.
name: Validate fixtures

# Run on every PR/push that touches fixtures, the validator, or this workflow.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate fixture files
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: fixture.schema.json — JSON syntax
        run: python3 -m json.tool fixtures/schema/fixture.schema.json > /dev/null

      - name: manifest.json — JSON syntax
        run: python3 -m json.tool fixtures/manifest.json > /dev/null

      - name: Validate listed fixture JSON files
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path(".")
          manifest = json.loads((root / "fixtures/manifest.json").read_text())
          for entry in manifest.get("fixtures", []):
              path = entry.get("path")
              if not path:
                  continue
              p = root / path
              if p.suffix.lower() != ".json":
                  continue
              json.loads(p.read_text())
              print(f"{path}: JSON OK")
          print("listed fixture JSON syntax: OK")
          PY

      - name: Cross-validate manifest, schema, and on-disk paths
        run: make validate-fixtures

  dissect:
    name: Wireshark dissector check of codec vectors
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install tshark
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq tshark
          tshark --version | head -1

      - name: Dissect codec vectors
        run: make dissect-fixtures
