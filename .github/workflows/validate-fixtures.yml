name: Validate fixtures

# Run on every PR/push that touches fixtures, the validator, or this workflow.
on:
  pull_request:
    paths:
      - 'fixtures/**'
      - 'scripts/validate-fixtures.py'
      - 'Makefile'
      - '.github/workflows/validate-fixtures.yml'
  push:
    branches:
      - main
    paths:
      - 'fixtures/**'
      - 'scripts/validate-fixtures.py'
      - 'Makefile'
      - '.github/workflows/validate-fixtures.yml'
  workflow_dispatch:

jobs:
  validate:
    name: Validate fixture files
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: fixture.schema.json — JSON syntax
        run: python3 -m json.tool fixtures/schema/fixture.schema.json > /dev/null

      - name: manifest.json — JSON syntax
        run: python3 -m json.tool fixtures/manifest.json > /dev/null

      - name: Validate listed fixture JSON files
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path(".")
          manifest = json.loads((root / "fixtures/manifest.json").read_text())
          for entry in manifest.get("fixtures", []):
              path = entry.get("path")
              if not path:
                  continue
              p = root / path
              if p.suffix.lower() != ".json":
                  continue
              json.loads(p.read_text())
              print(f"{path}: JSON OK")
          print("listed fixture JSON syntax: OK")
          PY

      - name: Cross-validate manifest, schema, and on-disk paths
        run: make validate-fixtures
