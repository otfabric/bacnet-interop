# SPDX-License-Identifier: MIT
name: Own stack (go-bacnet)
run-name: "Build bacnet-interop-otfabric from the latest go-bacnet, by @${{ github.actor }} on ${{ github.ref_name }}"

# Manual only. Builds ghcr.io/otfabric/bacnet-interop-otfabric from the latest
# go-bacnet release, tests it with the self-tests and the reference images of
# the latest harness release and, when run from main, publishes it as
# :<go-bacnet version> and :latest.
#
# Nothing is committed, and nothing else waits for this: no pin to bump, no
# release, no schedule. So no release loop can form (own/go-bacnet/README.md).
# The harness Release workflow and manifest.json do not contain this image.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: own-go-bacnet
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/otfabric/bacnet-interop-otfabric

jobs:
  version:
    name: Resolve versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      upstream: ${{ steps.version.outputs.upstream }}
      revision: ${{ steps.version.outputs.revision }}
      harness: ${{ steps.version.outputs.harness }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: version
        name: The latest go-bacnet, and the harness release to test against
        env:
          SHA: ${{ github.sha }}
          REF: ${{ github.ref_name }}
        run: |
          upstream=$(git ls-remote --tags --refs https://github.com/otfabric/go-bacnet.git 'v[0-9]*' \
            | sed 's,.*refs/tags/,,' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          [ -n "${upstream}" ] || { echo "::error::no go-bacnet release found"; exit 1; }
          # An annotated tag has a peeled line, with the commit.
          revision=$(git ls-remote --tags https://github.com/otfabric/go-bacnet.git "refs/tags/${upstream}^{}" | cut -f1)
          [ -n "${revision}" ] || revision=$(git ls-remote --tags https://github.com/otfabric/go-bacnet.git "refs/tags/${upstream}" | cut -f1)
          harness=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          [ -n "${harness}" ] || { echo "::error::no harness release found"; exit 1; }
          if [ "${REF}" = "main" ]; then publish="yes: ${IMAGE}:${upstream} and ${IMAGE}:latest"; else publish="no: not run from main"; fi
          {
            echo "upstream=${upstream}"
            echo "revision=${revision}"
            echo "harness=${harness}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Versions"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| go-bacnet (latest release) | \`${upstream}\` |"
            echo "| go-bacnet commit | \`${revision}\` |"
            echo "| Image tag | \`${upstream}\` |"
            echo "| Reference images and self-tests (latest harness release) | \`${harness}\` |"
            echo "| This repository | \`${REF}\` at \`${SHA}\` |"
            echo "| Publish | ${publish} |"
          } | tee -a "$GITHUB_STEP_SUMMARY"

  build:
    name: Build, test (${{ matrix.arch }})
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      HARNESS: ${{ needs.version.outputs.harness }}
      UPSTREAM: ${{ needs.version.outputs.upstream }}
      REVISION: ${{ needs.version.outputs.revision }}
      ADAPTER_IMAGE_otfabric: ghcr.io/otfabric/bacnet-interop-otfabric:ci
    steps:
      - uses: actions/checkout@v7

      - name: Build from go-bacnet ${{ needs.version.outputs.upstream }}
        run: |
          retry() { for i in 1 2 3; do "$@" && return 0; echo "attempt ${i} failed: $*" >&2; sleep $((i * 15)); done; return 1; }
          retry docker build --progress=plain \
            --build-arg UPSTREAM_VERSION="${UPSTREAM}" --build-arg UPSTREAM_SHA="${REVISION}" \
            --build-arg ADAPTER_VERSION="${UPSTREAM}" \
            --tag "${ADAPTER_IMAGE_otfabric}" --file own/go-bacnet/Dockerfile .

      - name: What was built
        run: |
          reported=$(docker run --rm "${ADAPTER_IMAGE_otfabric}" print-capabilities | jq -r '.upstream.version')
          {
            echo "## ${{ matrix.arch }}"
            echo
            echo "- \`$(docker run --rm "${ADAPTER_IMAGE_otfabric}" version)\`"
            docker run --rm "${ADAPTER_IMAGE_otfabric}" print-capabilities | jq -r '"- upstream \(.upstream.name) \(.upstream.version), commit `\(.upstream.revision)`, independent engine: \(.upstream.independentEngine)"'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          [ "${reported}" = "${UPSTREAM}" ] || { echo "::error::the image reports go-bacnet ${reported}, want ${UPSTREAM}"; exit 1; }

      # The self-tests are those of the harness release whose reference images
      # they run against: main's scripts may already check what only the next
      # release's references do.
      - name: Check out the self-tests of ${{ needs.version.outputs.harness }}
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.harness }}
          path: harness

      # The references with client mode (CLIENTS of client-matrix.py), by the
      # digest in manifest.json of that release.
      - name: Pull the reference images of ${{ needs.version.outputs.harness }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          retry() { for i in 1 2 3; do "$@" && return 0; echo "attempt ${i} failed: $*" >&2; sleep $((i * 15)); done; return 1; }
          retry gh release download "${HARNESS}" --repo "${GITHUB_REPOSITORY}" --pattern manifest.json --dir harness-release
          clients=$(sed -nE '/^CLIENTS = \{/,/^\}/s/^    "([a-z0-9-]+)": "([A-Z0-9_]+)",$/\1=\2/p' harness/scripts/client-matrix.py)
          [ -n "${clients}" ] || { echo "::error::no CLIENTS in client-matrix.py of ${HARNESS}"; exit 1; }
          for pair in ${clients}; do
            name=${pair%%=*}; var=${pair#*=}
            ref=$(jq -r --arg n "${name}" '.peers[$n] | "\(.image)@\(.digest)"' harness-release/manifest.json)
            case "${ref}" in *@sha256:*) ;; *) echo "::error::${name} is not in manifest.json of ${HARNESS}"; exit 1;; esac
            retry docker pull --quiet "${ref}"
            echo "${var}=${ref}" >> "$GITHUB_ENV"
            echo "- ${name}: \`${ref}\`" | tee -a "$GITHUB_STEP_SUMMARY"
          done

      - name: Smoke, cross-stack self-test against the references
        working-directory: harness
        run: |
          set -o pipefail
          mkdir -p reports
          SMOKE_ONLY=otfabric REPORT_DIR=reports scripts/smoke-test.sh 2>&1 | tee reports/smoke.log
          python3 scripts/client-matrix.py --all-devices --gate otfabric \
            --extra-differences ../own/go-bacnet/expected-differences.json 2>&1 | tee reports/matrix.log

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: own-go-bacnet-reports-${{ matrix.arch }}
          path: harness/reports/
          if-no-files-found: ignore

      - name: Push the tested image as <version>-<arch>
        if: github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCH: ${{ matrix.arch }}
          ACTOR: ${{ github.actor }}
        run: |
          retry() { for i in 1 2 3; do "$@" && return 0; echo "attempt ${i} failed: $*" >&2; sleep $((i * 15)); done; return 1; }
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io --username "${ACTOR}" --password-stdin
          docker tag "${ADAPTER_IMAGE_otfabric}" "${IMAGE}:${UPSTREAM}-${ARCH}"
          retry docker push --quiet "${IMAGE}:${UPSTREAM}-${ARCH}"

  publish:
    name: Publish ${{ needs.version.outputs.upstream }} and latest
    needs: [version, build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      UPSTREAM: ${{ needs.version.outputs.upstream }}
    steps:
      - name: Join the architectures
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          retry() { for i in 1 2 3; do "$@" && return 0; echo "attempt ${i} failed: $*" >&2; sleep $((i * 15)); done; return 1; }
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io --username "${ACTOR}" --password-stdin
          retry docker buildx imagetools create --tag "${IMAGE}:${UPSTREAM}" --tag "${IMAGE}:latest" \
            "${IMAGE}:${UPSTREAM}-amd64" "${IMAGE}:${UPSTREAM}-arm64"
          digest=$(docker buildx imagetools inspect "${IMAGE}:${UPSTREAM}" --format '{{.Manifest.Digest}}')
          {
            echo "## Published"
            echo
            echo "- \`${IMAGE}:${UPSTREAM}\`"
            echo "- \`${IMAGE}:latest\`"
            echo "- \`${IMAGE}@${digest}\`"
          } | tee -a "$GITHUB_STEP_SUMMARY"
