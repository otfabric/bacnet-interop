name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # create GitHub release
  packages: write   # push to GHCR

# Native amd64 + arm64 runners (no QEMU). Each platform pushes by digest;
# merge creates the multi-arch tags consumers pin.

jobs:
  prepare:
    name: Validate and detect adapters
    runs-on: ubuntu-24.04
    outputs:
      adapters: ${{ steps.detect.outputs.adapters }}
      has_adapters: ${{ steps.detect.outputs.has_adapters }}
      version: ${{ steps.detect.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # v0.8.0 and v0.9.0 were tagged on commits that were amended on main
      # afterwards: the tagged tree kept the previous version in its documents
      # and inventory while its images reported the new one. A release must be
      # cut from a commit that is on main.
      - name: Tag must be on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::${GITHUB_REF_NAME} (${GITHUB_SHA}) is not an ancestor of origin/main. Push main first, then tag the commit that is on it; do not amend or rebase main after tagging."
            exit 1
          fi

      # The inventory version is what README, PEER_SUPPORT and the adapter
      # READMEs are written against; it must name the release being cut.
      - name: Inventory version matches the tag
        run: |
          set -euo pipefail
          want="${GITHUB_REF_NAME#v}"
          have="$(sed -n 's/^adapter_version: *"\{0,1\}\([^"]*\)"\{0,1\} *$/\1/p' adapters/inventory.yaml | head -1)"
          if [ "$have" != "$want" ]; then
            echo "::error::adapters/inventory.yaml has adapter_version \"$have\", the tag is $GITHUB_REF_NAME. Update the inventory and the documents, commit to main, then tag."
            exit 1
          fi

      # The body of the GitHub release is the section of this tag in
      # RELEASE.md, up to its "---" line (the otfabric rule). Check it before
      # anything is built or pushed.
      - name: RELEASE.md has the notes of the tag
        run: scripts/release-notes.sh "${GITHUB_REF_NAME}"

      - name: Validate fixtures before release
        run: make validate-fixtures

      - name: Detect adapter Dockerfiles
        id: detect
        run: |
          set -euo pipefail
          # metadata-action type=semver pattern={{version}} strips a leading v.
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          adapters='[]'
          add_adapter() {
            local name="$1" file="$2" image="$3" kind="$4" pin_grep="${5:-}" pin_fixed="${6:-}"
            adapters=$(jq -c \
              --arg name "$name" \
              --arg file "$file" \
              --arg image "$image" \
              --arg kind "$kind" \
              --arg pin_grep "$pin_grep" \
              --arg pin_fixed "$pin_fixed" \
              '. + [{
                name: $name,
                file: $file,
                image: $image,
                kind: $kind,
                pin_grep: $pin_grep,
                pin_fixed: $pin_fixed
              }]' <<<"$adapters")
          }

          if [ -f adapters/bacnet-stack/Dockerfile ]; then
            add_adapter bacnet-stack \
              adapters/bacnet-stack/Dockerfile \
              ghcr.io/otfabric/bacnet-interop-bacnet-stack \
              peer \
              'BACNET_STACK_(SHA|VERSION|REF)='
          fi
          if [ -f adapters/bacpypes3/Dockerfile ]; then
            add_adapter bacpypes3 \
              adapters/bacpypes3/Dockerfile \
              ghcr.io/otfabric/bacnet-interop-bacpypes3 \
              peer \
              'BACPYPES3_(VERSION|REF)='
          fi
          if [ -f adapters/bacnet4j/Dockerfile ]; then
            add_adapter bacnet4j \
              adapters/bacnet4j/Dockerfile \
              ghcr.io/otfabric/bacnet-interop-bacnet4j \
              peer \
              'BACNET4J_(VERSION|REF)='
          fi
          if [ -f adapters/worldiety/Dockerfile ]; then
            add_adapter worldiety \
              adapters/worldiety/Dockerfile \
              ghcr.io/otfabric/bacnet-interop-worldiety \
              peer \
              'WORLDIETY_(COMMIT|REF)='
          fi
          if [ -f adapters/sysiobacnet/Dockerfile ]; then
            add_adapter sysiobacnet \
              adapters/sysiobacnet/Dockerfile \
              ghcr.io/otfabric/bacnet-interop-sysiobacnet \
              peer \
              'SYSIOBACNET_(VERSION|REF)='
          fi
          if [ -f adapters/bip-router/Dockerfile ]; then
            add_adapter bip-router \
              adapters/bip-router/Dockerfile \
              ghcr.io/otfabric/bacnet-interop-bip-router \
              topology \
              '' \
              topology-router-v1
          fi
          if [ -f adapters/bacnet-stack-router/Dockerfile ]; then
            add_adapter bacnet-stack-router \
              adapters/bacnet-stack-router/Dockerfile \
              ghcr.io/otfabric/bacnet-interop-bacnet-stack-router \
              topology \
              'BACNET_STACK_(SHA|VERSION|REF)='
          fi

          echo "adapters=${adapters}" >> "$GITHUB_OUTPUT"
          if [ "$adapters" = '[]' ]; then
            echo "has_adapters=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_adapters=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Detected adapters: ${adapters}"

  build:
    name: Build ${{ matrix.adapter.name }} (${{ matrix.arch }})
    needs: prepare
    if: needs.prepare.outputs.has_adapters == 'true'
    strategy:
      fail-fast: true
      matrix:
        adapter: ${{ fromJson(needs.prepare.outputs.adapters) }}
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'amd64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.adapter.file }}
          platforms: linux/${{ matrix.arch }}
          provenance: false
          build-args: |
            ADAPTER_VERSION=${{ github.ref_name }}
          outputs: type=image,name=${{ matrix.adapter.image }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"
          echo "Exported ${{ matrix.adapter.name }} linux/${{ matrix.arch }} → ${digest}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.adapter.name }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Manifest, provenance, release
    needs: [prepare, build]
    if: |
      always() &&
      needs.prepare.result == 'success' &&
      (needs.prepare.outputs.has_adapters != 'true' || needs.build.result == 'success')
    runs-on: ubuntu-24.04
    outputs:
      bacnet-stack-digest: ${{ steps.collect.outputs.bacnet-stack-digest }}
      bacpypes3-digest: ${{ steps.collect.outputs.bacpypes3-digest }}
      bacnet4j-digest: ${{ steps.collect.outputs.bacnet4j-digest }}
      worldiety-digest: ${{ steps.collect.outputs.worldiety-digest }}
      sysiobacnet-digest: ${{ steps.collect.outputs.sysiobacnet-digest }}
      bip-router-digest: ${{ steps.collect.outputs.bip-router-digest }}
      bacnet-stack-router-digest: ${{ steps.collect.outputs.bacnet-stack-router-digest }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        if: needs.prepare.outputs.has_adapters == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: needs.prepare.outputs.has_adapters == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download digests
        if: needs.prepare.outputs.has_adapters == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: digests-*
          path: ${{ runner.temp }}/digests
          merge-multiple: false

      - name: Metadata — bacnet-stack
        if: hashFiles('adapters/bacnet-stack/Dockerfile') != ''
        id: meta-bacnet-stack
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/otfabric/bacnet-interop-bacnet-stack
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Metadata — bacpypes3
        if: hashFiles('adapters/bacpypes3/Dockerfile') != ''
        id: meta-bacpypes3
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/otfabric/bacnet-interop-bacpypes3
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Metadata — bacnet4j
        if: hashFiles('adapters/bacnet4j/Dockerfile') != ''
        id: meta-bacnet4j
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/otfabric/bacnet-interop-bacnet4j
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Metadata — worldiety
        if: hashFiles('adapters/worldiety/Dockerfile') != ''
        id: meta-worldiety
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/otfabric/bacnet-interop-worldiety
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Metadata — sysiobacnet
        if: hashFiles('adapters/sysiobacnet/Dockerfile') != ''
        id: meta-sysiobacnet
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/otfabric/bacnet-interop-sysiobacnet
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Metadata — bip-router
        if: hashFiles('adapters/bip-router/Dockerfile') != ''
        id: meta-bip-router
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/otfabric/bacnet-interop-bip-router
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Metadata — bacnet-stack-router
        if: hashFiles('adapters/bacnet-stack-router/Dockerfile') != ''
        id: meta-bacnet-stack-router
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/otfabric/bacnet-interop-bacnet-stack-router
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Merge multi-arch manifests
        if: needs.prepare.outputs.has_adapters == 'true'
        id: collect
        env:
          ADAPTERS_JSON: ${{ needs.prepare.outputs.adapters }}
          META_STACK: ${{ steps.meta-bacnet-stack.outputs.tags }}
          META_BACP: ${{ steps.meta-bacpypes3.outputs.tags }}
          META_B4J: ${{ steps.meta-bacnet4j.outputs.tags }}
          META_WORLD: ${{ steps.meta-worldiety.outputs.tags }}
          META_SYSIO: ${{ steps.meta-sysiobacnet.outputs.tags }}
          META_BIP: ${{ steps.meta-bip-router.outputs.tags }}
          META_STACK_ROUTER: ${{ steps.meta-bacnet-stack-router.outputs.tags }}
        run: |
          set -euo pipefail

          tags_for() {
            case "$1" in
              bacnet-stack) printf '%s' "$META_STACK" ;;
              bacpypes3)    printf '%s' "$META_BACP" ;;
              bacnet4j)     printf '%s' "$META_B4J" ;;
              worldiety)    printf '%s' "$META_WORLD" ;;
              sysiobacnet)  printf '%s' "$META_SYSIO" ;;
              bip-router)   printf '%s' "$META_BIP" ;;
              bacnet-stack-router) printf '%s' "$META_STACK_ROUTER" ;;
              *)            return 1 ;;
            esac
          }

          version="${GITHUB_REF_NAME#v}"
          digest_root="${RUNNER_TEMP}/digests"

          while IFS= read -r name; do
            image=$(jq -r --arg n "$name" '.[] | select(.name==$n) | .image' <<<"$ADAPTERS_JSON")

            refs=()
            for arch in amd64 arm64; do
              dir="${digest_root}/digests-${name}-${arch}"
              if [ ! -d "$dir" ]; then
                echo "missing digest artifact for ${name}/${arch} (expected ${dir})" >&2
                exit 1
              fi
              d=$(find "$dir" -type f -printf '%f\n' | head -1)
              if [ -z "$d" ]; then
                echo "empty digest artifact for ${name}/${arch}" >&2
                exit 1
              fi
              refs+=("${image}@sha256:${d}")
            done

            tag_args=()
            while IFS= read -r tag; do
              [ -n "$tag" ] || continue
              tag_args+=("-t" "$tag")
            done < <(tags_for "$name")

            if [ "${#tag_args[@]}" -eq 0 ]; then
              echo "no tags computed for ${name}" >&2
              exit 1
            fi

            docker buildx imagetools create "${tag_args[@]}" "${refs[@]}"

            digest=$(docker buildx imagetools inspect "${image}:${version}" --format '{{.Manifest.Digest}}')
            echo "${name}-digest=${digest}" >> "$GITHUB_OUTPUT"
            echo "Merged ${name} → ${digest}"
          done < <(jq -r '.[].name' <<<"$ADAPTERS_JSON")

      - name: Generate manifest.json
        env:
          ADAPTERS_JSON: ${{ needs.prepare.outputs.adapters }}
          STACK_DIGEST: ${{ steps.collect.outputs.bacnet-stack-digest }}
          BACP_DIGEST: ${{ steps.collect.outputs.bacpypes3-digest }}
          B4J_DIGEST: ${{ steps.collect.outputs.bacnet4j-digest }}
          WORLD_DIGEST: ${{ steps.collect.outputs.worldiety-digest }}
          SYSIO_DIGEST: ${{ steps.collect.outputs.sysiobacnet-digest }}
          BIP_DIGEST: ${{ steps.collect.outputs.bip-router-digest }}
          STACK_ROUTER_DIGEST: ${{ steps.collect.outputs.bacnet-stack-router-digest }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, pathlib

          adapters = json.loads(os.environ.get("ADAPTERS_JSON") or "[]")
          digests = {
              "bacnet-stack": os.environ.get("STACK_DIGEST") or None,
              "bacpypes3": os.environ.get("BACP_DIGEST") or None,
              "bacnet4j": os.environ.get("B4J_DIGEST") or None,
              "worldiety": os.environ.get("WORLD_DIGEST") or None,
              "sysiobacnet": os.environ.get("SYSIO_DIGEST") or None,
              "bip-router": os.environ.get("BIP_DIGEST") or None,
              "bacnet-stack-router": os.environ.get("STACK_ROUTER_DIGEST") or None,
          }

          def pin_for(adapter):
              fixed = adapter.get("pin_fixed") or ""
              if fixed:
                  return fixed
              grep_pat = adapter.get("pin_grep") or ""
              path = adapter.get("file") or ""
              if not grep_pat or not path:
                  return None
              p = pathlib.Path(path)
              if not p.is_file():
                  return None
              cre = re.compile(grep_pat)
              for line in p.read_text(encoding="utf-8").splitlines():
                  if cre.search(line) and "=" in line:
                      return line.split("=", 1)[1].strip() or None
              return None

          peers = {}
          topology = {}
          for adapter in adapters:
              entry = {
                  "pin": pin_for(adapter),
                  "image": adapter["image"],
                  "digest": digests.get(adapter["name"]) or None,
              }
              if adapter.get("kind") == "topology":
                  topology[adapter["name"]] = entry
              else:
                  peers[adapter["name"]] = entry

          for name, image in (
              ("bacnet-stack", "ghcr.io/otfabric/bacnet-interop-bacnet-stack"),
              ("bacpypes3", "ghcr.io/otfabric/bacnet-interop-bacpypes3"),
              ("bacnet4j", "ghcr.io/otfabric/bacnet-interop-bacnet4j"),
              ("worldiety", "ghcr.io/otfabric/bacnet-interop-worldiety"),
              ("sysiobacnet", "ghcr.io/otfabric/bacnet-interop-sysiobacnet"),
          ):
              peers.setdefault(name, {"pin": None, "image": image, "digest": None})
          topology.setdefault(
              "bip-router",
              {
                  "pin": None,
                  "image": "ghcr.io/otfabric/bacnet-interop-bip-router",
                  "digest": None,
              },
          )
          topology.setdefault(
              "bacnet-stack-router",
              {
                  "pin": None,
                  "image": "ghcr.io/otfabric/bacnet-interop-bacnet-stack-router",
                  "digest": None,
              },
          )

          manifest = {
              "version": os.environ["GITHUB_REF_NAME"],
              "fixture_schema": "fixtures/schema/fixture.schema.json",
              "peers": peers,
              "topology": topology,
          }
          with open("manifest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          print(open("manifest.json", encoding="utf-8").read())
          PY

      - name: Generate checksums.txt
        run: |
          sha256sum manifest.json > checksums.txt
          cat checksums.txt

      # The body is the section of this version in RELEASE.md (up to its
      # "---", as in every otfabric repository), followed by the images.
      - name: Write the release body
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          STACK_DIGEST: ${{ steps.collect.outputs.bacnet-stack-digest }}
          BACP_DIGEST: ${{ steps.collect.outputs.bacpypes3-digest }}
          B4J_DIGEST: ${{ steps.collect.outputs.bacnet4j-digest }}
          WORLD_DIGEST: ${{ steps.collect.outputs.worldiety-digest }}
          SYSIO_DIGEST: ${{ steps.collect.outputs.sysiobacnet-digest }}
          BIP_DIGEST: ${{ steps.collect.outputs.bip-router-digest }}
          STACK_ROUTER_DIGEST: ${{ steps.collect.outputs.bacnet-stack-router-digest }}
        run: |
          set -euo pipefail
          registry=ghcr.io/otfabric
          # name|digest|pin variable, in the order of the table.
          images=(
            "bacnet-stack|${STACK_DIGEST}|BACNET_STACK_IMAGE"
            "bacpypes3|${BACP_DIGEST}|BACPYPES3_IMAGE"
            "bacnet4j|${B4J_DIGEST}|BACNET4J_IMAGE"
            "worldiety|${WORLD_DIGEST}|WORLDIETY_IMAGE"
            "sysiobacnet|${SYSIO_DIGEST}|SYSIOBACNET_IMAGE"
            "bip-router|${BIP_DIGEST}|BIP_ROUTER_IMAGE"
            "bacnet-stack-router|${STACK_ROUTER_DIGEST}|BACNET_STACK_ROUTER_IMAGE"
          )
          {
            scripts/release-notes.sh "${GITHUB_REF_NAME}"
            echo
            echo "## Adapter images"
            echo
            echo "BACnet/IP peer images for interoperability tests."
            echo "Multi-arch manifests (\`linux/amd64\`, \`linux/arm64\`) built on native runners (no QEMU)."
            echo
            echo "| Image | Digest |"
            echo "|-------|--------|"
            for entry in "${images[@]}"; do
              IFS='|' read -r name digest _ <<<"${entry}"
              echo "| \`${registry}/bacnet-interop-${name}:${VERSION}\` | \`${digest:-not published (Dockerfile pending)}\` |"
            done
            echo
            echo "\`bip-router\` is a topology aid (not a peer oracle). \`bacnet-stack-router\` is upstream bacnet-stack \`apps/router\` (a native router, not a device). Worldiety is the fourth peer oracle, System.IO.BACnet (\`sysiobacnet\`) the fifth."
            echo
            echo "## Pinning in consumer repositories"
            echo
            echo '```bash'
            for entry in "${images[@]}"; do
              IFS='|' read -r name digest var <<<"${entry}"
              echo "${var}=${registry}/bacnet-interop-${name}@${digest:-sha256:<digest>}"
            done
            echo '```'
            echo
            echo "See \`manifest.json\` for fixture schema path and peer provenance pins."
            echo "Adapter Dockerfiles may still be pending; fixture-only tags remain valid for schema/manifest consumers."
          } > "${RUNNER_TEMP}/release-body.md"
          cat "${RUNNER_TEMP}/release-body.md"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          body_path: ${{ runner.temp }}/release-body.md
          files: |
            manifest.json
            checksums.txt
