# Machine-readable adapter inventory for bacnet-interop.
# Capability cells: native | adapter-shim | unsupported | topology-aid
# Assertions live in go-bacnet/interop; this file documents peer pins and evidence types.

schema_version: "1"
adapter_version: "0.13.0"
fixture: device-baseline-v2
fixture_frozen: device-baseline-v1
# Fixtures shipped by one adapter only (selected with DEVICE_FIXTURE_FILE / FIXTURE).
fixtures_single_adapter:
  device-baseline-v9: [bacnet-stack]  # large object model; since 0.10.0

adapters:
  - id: bacnet-stack
    image: ghcr.io/otfabric/bacnet-interop-bacnet-stack
    upstream: bacnet-stack
    upstream_version: "1.6.1"
    role: peer-oracle
    capabilities:
      who_is_i_am: native
      who_has_i_have: native
      read_property: native
      read_property_multiple: native
      write_property: native
      write_property_multiple: native
      read_range_by_position: native
      read_range_by_sequence_number: native  # frozen upstream seed: 1000 records, sequence 9001..10000
      read_range_by_time: native
      large_object_list: native  # device-baseline-v9; whole read Aborts at Max_APDU 50 (no segmentation)
      cov: native
      get_alarm_summary: native
      get_enrollment_summary: unsupported
      cov_multiple: unsupported
      messaging_time_sync: native
      messaging_text: unsupported
      messaging_private_transfer: native  # unconfirmed only
      messaging_write_group: native
      event_notification_emit: unsupported
      device_communication_control: native
      reinitialize_device_warmstart: native
      segmented_confirmed_request_receive: unsupported
      peer_as_bbmd: native  # BBMD_ENABLED in device_server; BDT self-seed + Accept-FD
    client_capabilities:  # docs/CLIENT_DRIVER_CONTRACT.md
      who_is_i_am: native  # bacwi
      who_has_i_have: native  # bacwh
      read_property: native  # bacrp
      read_property_multiple: native  # bacrpm
      write_property: native  # bacwp
      write_property_multiple: native  # bacwpm
      subscribe_cov: native  # bacscov; initial notification checked
      read_range_by_position: native  # bacrr
      device_communication_control: native  # bacdcc
      reinitialize_device: native  # bacrd
      atomic_read_file_stream: native  # bacarf
      atomic_write_file_stream: native  # bacawf
      add_list_element: native  # bacale
      remove_list_element: native  # bacrle sends it, but registers its reply handlers for AddListElement and prints nothing (apps/remove-list-element/main.c); scenario result known-difference, removal checked by read-back
      create_object: native  # bacco
      delete_object: native  # bacdo
      get_event_information: native  # bacge; an empty list fails to decode in the tool
      acknowledge_alarm: native  # bacackalarm
      time_synchronization: native  # bacts, bacts --utc
      unconfirmed_private_transfer: native  # bacupt
      write_group: native  # bacwg
      foreign_device_registration: native  # --bbmd/--fd-ttl via BACNET_BBMD_* (dlenv.c)
      read_bdt: native  # bacrbdt
      read_fdt: native  # bacrfdt
      write_bdt: native  # bacwbdt
      segmentation: unsupported  # tools built without segmentation
      subscribe_cov_property: unsupported  # no tool
      get_alarm_summary: unsupported  # no tool
      get_enrollment_summary: unsupported  # no tool
      text_message: unsupported  # no tool
      confirmed_private_transfer: unsupported  # no tool

  - id: bacpypes3
    image: ghcr.io/otfabric/bacnet-interop-bacpypes3
    upstream: BACpypes3
    upstream_version: "0.0.110"
    role: peer-oracle
    capabilities:
      who_is_i_am: native
      who_has_i_have: native
      read_property: native
      read_property_multiple: native
      write_property: native
      write_property_multiple: adapter-shim  # do_WritePropertyMultipleRequest → write_property
      read_range_by_position: unsupported  # upstream NotImplementedError; TrendLog skipped
      cov: native
      get_alarm_summary: unsupported
      get_enrollment_summary: adapter-shim  # since 0.10.0: upstream request/ACK types, adapter handler and enrollment list
      cov_multiple: unsupported
      messaging_time_sync: native  # adapter do_* sinks + operation JSONL
      messaging_text: native
      messaging_private_transfer: native
      messaging_write_group: native
      event_notification_emit: adapter-shim  # BACNET_EMIT_EVENT=1 after first ReadProperty
      device_communication_control: native  # since 0.10.0; upstream acknowledges "disable" without enforcing it
      reinitialize_device_warmstart: adapter-shim  # SimpleACK; no process restart
      segmented_confirmed_request_receive: native
      peer_as_bbmd: native  # BACNET_BBMD=1
    client_capabilities:  # docs/CLIENT_DRIVER_CONTRACT.md; upstream Application, APDU classes
      who_is_i_am: native  # Application.who_is
      who_has_i_have: native  # Application.who_has
      read_property: native  # ReadPropertyRequest
      read_property_multiple: native  # Application.read_property_multiple
      write_property: native  # WritePropertyRequest
      write_property_multiple: native  # WritePropertyMultipleRequest; WritePropertyMultipleError decoded
      subscribe_cov: native  # SubscribeCOVRequest; notifications decoded upstream, recorded by adapter do_* handlers
      subscribe_cov_property: native  # SubscribeCOVPropertyRequest; its Error is not decodable (service 28 not in error_types): known-difference
      subscribe_cov_property_multiple: unsupported  # no request APDU, no COV-multiple notification type
      read_range_by_position: native  # ReadRangeRequest, LogRecord list
      device_communication_control: native
      reinitialize_device: native
      atomic_read_file_stream: native
      atomic_write_file_stream: native
      add_list_element: native  # ChangeList-Error not decodable (ChangeListError has no service_choice): known-difference
      remove_list_element: native  # as add_list_element
      create_object: native  # CreateObjectError decoded
      delete_object: native
      get_event_information: native
      acknowledge_alarm: native
      get_alarm_summary: native  # an empty GetAlarmSummary-ACK is not decodable: known-difference
      get_enrollment_summary: native  # an empty GetEnrollmentSummary-ACK is not decodable: known-difference
      text_message: native  # Confirmed and UnconfirmedTextMessageRequest
      confirmed_private_transfer: native
      time_synchronization: native
      unconfirmed_private_transfer: native
      write_group: native
      foreign_device_registration: native  # IPMode.foreign network port, --bbmd/--fd-ttl
      read_bdt: native  # BVLLServiceElement on an unregistered NormalLinkLayer (foreign mode takes every BVLC-Result as registration)
      read_fdt: native  # as read_bdt
      write_bdt: native  # as read_bdt
      segmentation: native  # segmented-both: segmented ComplexACK and segmented request
      undecodable_answer_detection: adapter-shim  # sap_response wrapper decodes a copy of each Error/ComplexACK and records failures

  - id: bacpypes
    # Legacy BACpypes (PyPI bacpypes, asyncore), not BACpypes3 (id bacpypes3).
    image: ghcr.io/otfabric/bacnet-interop-bacpypes
    upstream: BACpypes
    upstream_version: "0.19.0"
    role: peer-oracle
    capabilities:
      who_is_i_am: native  # WhoIsIAmServices
      who_has_i_have: native  # WhoHasIHaveServices
      read_property: native  # ReadWritePropertyServices
      read_property_multiple: native  # ReadWritePropertyMultipleServices; ALL/REQUIRED/OPTIONAL expanded
      write_property: native  # a value of the wrong datatype is Rejected invalid-tag, not Error invalid-data-type
      write_property_multiple: adapter-shim  # upstream do_WritePropertyMultipleRequest is commented out (service/object.py); adapter handler answers WritePropertyMultiple-Error
      read_range_by_position: adapter-shim  # ReadRange APDU upstream, no handler; adapter reads the TrendLogObject logBuffer
      read_range_by_sequence_number: adapter-shim  # as read_range_by_position
      read_range_by_time: unsupported
      cov: native  # ChangeOfValueServices: SubscribeCOV, SubscribeCOVProperty (the property is not checked); confirmed and unconfirmed notifications
      get_alarm_summary: unsupported  # Reject unrecognized-service
      get_enrollment_summary: unsupported  # Reject unrecognized-service
      get_event_information: unsupported  # Reject unrecognized-service
      acknowledge_alarm: unsupported  # Reject unrecognized-service
      cov_multiple: unsupported  # no SubscribeCOVPropertyMultiple APDU
      messaging_time_sync: adapter-shim  # APDU decoded upstream; adapter do_* sink + operation JSONL
      messaging_text: adapter-shim  # as messaging_time_sync; ConfirmedTextMessage SimpleACK
      messaging_private_transfer: adapter-shim  # as messaging_time_sync; ConfirmedPrivateTransfer-ACK
      messaging_write_group: adapter-shim  # as messaging_time_sync
      event_notification_emit: unsupported
      device_communication_control: native  # DeviceCommunicationControlServices; "disable" acknowledged and enforced in the SMAP
      reinitialize_device_warmstart: adapter-shim  # APDU upstream, no handler; SimpleACK, password checked, no process restart
      atomic_read_file_stream: native  # FileServices; contents in adapter subclasses of the abstract Local*AccessFileObject
      atomic_write_file_stream: native  # as atomic_read_file_stream
      segmented_confirmed_request_receive: native  # segmented-both; window BACNET_SEGMENT_WINDOW (SMAP proposedWindowSize)
      peer_as_bbmd: native  # BACNET_BBMD=1: BIPBBMD; Register-FD accepted (remaining TTL+5), Write-BDT NAK 0x0010
    client_capabilities:  # docs/CLIENT_DRIVER_CONTRACT.md; upstream Application, IOCB and APDU classes
      who_is_i_am: native  # WhoIsRequest; I-Am recorded by WhoIsIAmServices
      who_has_i_have: native  # WhoHasRequest (Application.who_has raises NotImplementedError); I-Have recorded by the adapter
      read_property: native  # ReadPropertyRequest
      read_property_multiple: native  # ReadPropertyMultipleRequest
      write_property: native  # WritePropertyRequest
      write_property_multiple: native  # WritePropertyMultipleRequest; WritePropertyMultipleError decoded
      subscribe_cov: native  # SubscribeCOVRequest; notifications recorded by adapter do_* handlers
      subscribe_cov_property: native  # SubscribeCOVPropertyRequest
      subscribe_cov_property_multiple: unsupported  # no request APDU (apdu.py registers no confirmed service 30)
      read_range_by_position: native  # ReadRangeRequest
      device_communication_control: native
      reinitialize_device: native
      atomic_read_file_stream: native
      atomic_write_file_stream: native
      add_list_element: native  # ChangeListError decoded
      remove_list_element: native
      create_object: native  # CreateObjectError decoded
      delete_object: native
      get_event_information: native
      acknowledge_alarm: native
      get_alarm_summary: native
      get_enrollment_summary: native
      text_message: native  # Confirmed and UnconfirmedTextMessageRequest
      confirmed_private_transfer: native
      time_synchronization: native
      unconfirmed_private_transfer: native
      write_group: native
      foreign_device_registration: native  # BIPForeign, --bbmd/--fd-ttl
      read_bdt: native  # BVLL ReadBroadcastDistributionTable over a second AnnexJCodec/UDPMultiplexer (BIPForeign takes every BVLC-Result as its registration)
      read_fdt: native  # as read_bdt
      write_bdt: native  # as read_bdt
      segmentation: native  # segmented-both: segmented ComplexACK and segmented request
      undecodable_answer_detection: adapter-shim  # ASAP.confirmation wrapper decodes a copy of each answer and records failures

  - id: bacnet4j
    image: ghcr.io/otfabric/bacnet-interop-bacnet4j
    upstream: BACnet4J
    upstream_version: "6.1.1"
    role: peer-oracle
    capabilities:
      who_is_i_am: native
      who_has_i_have: native
      read_property: native
      read_property_multiple: native
      write_property: native
      write_property_multiple: native
      read_range_by_position: native  # TrendLogObject seeded buffer
      read_range_by_sequence_number: native  # since 0.10.0 (36 seeded records)
      read_range_by_time: native  # since 0.10.0
      cov: native
      get_alarm_summary: native
      get_enrollment_summary: native
      cov_multiple: unsupported  # request parsed by the stack (operation line); with BACNET_EMIT_COV_MULTIPLE=1 notifications are emitted with the stack's encoder
      messaging_time_sync: native
      messaging_text: native
      messaging_private_transfer: native
      messaging_write_group: unsupported  # WriteGroupRequest.handle NotImplementedException
      event_notification_emit: adapter-shim  # BACNET_EMIT_EVENT=1 after first ReadProperty
      device_communication_control: native
      reinitialize_device_warmstart: adapter-shim  # handler SimpleACK; no process restart
      segmented_confirmed_request_receive: unsupported  # rejects segmented confirmed requests
      peer_as_bbmd: native  # BACNET_BBMD=1
    client_capabilities:  # docs/CLIENT_DRIVER_CONTRACT.md; ClientDriver.java over LocalDevice
      who_is_i_am: native  # WhoIsRequest; I-Am collected by iAmReceived
      who_has_i_have: native  # WhoHasRequest; iHaveReceived
      read_property: native
      read_property_multiple: native
      write_property: native
      write_property_multiple: native
      subscribe_cov: native  # initial notification via covNotificationReceived
      read_range_by_position: native
      device_communication_control: native
      reinitialize_device: native
      atomic_read_file_stream: native
      atomic_write_file_stream: native
      add_list_element: native
      remove_list_element: native
      create_object: native
      delete_object: native
      get_event_information: native
      acknowledge_alarm: native
      time_synchronization: native
      unconfirmed_private_transfer: native
      write_group: native  # WriteGroupRequest encoder (the stack cannot serve it)
      foreign_device_registration: native  # IpNetwork.registerAsForeignDevice
      read_bdt: unsupported  # IpNetwork serves BVLC table functions as a BBMD only
      read_fdt: unsupported
      write_bdt: unsupported
      segmentation: native  # segmented ComplexACK reassembly and segmented requests (DefaultTransport)
      subscribe_cov_property: native
      subscribe_cov_property_multiple: adapter-shim  # request and error native; COVNotificationMultiple decoded by the stack but handle() throws NotImplementedException, seen in requestReceived. The error's firstFailedSubscription is dropped (decoded as a CHOICE): known-difference
      get_alarm_summary: native
      get_enrollment_summary: native
      text_message: native  # confirmed and unconfirmed
      confirmed_private_transfer: native

