  - id: cbsigma
    image: ghcr.io/otfabric/bacnet-interop-cbsigma
    upstream: cB-Sigma bacnet (device role) and bacnet-sim (simulator), Go, Apache-2.0
    upstream_version: "bacnet v0.2.0, bacnet-sim v0.1.0"
    upstream_commit: "43314a7b2979e86e55b759fbc6b32a587dcc1a37 (bacnet), 8ca57e10b4feea721c75a995fd3668af4a037b39 (bacnet-sim)"
    role: peer-oracle
    since: "0.13.0"
    roles: [device, sim]  # CBSIGMA_ROLE; device is the default
    evidence:
      bvlc: native
      npdu: native
      apdu_dispatch: native
      confirmed_transactions: native
      segmented_request_receive: native
      segmented_complex_ack_send: native
      fixture_object_model: adapter-shim  # the upstream object table, filled from the fixture
      service_payload_handlers: native
    capabilities:
      who_is_i_am: native  # both roles
      who_has_i_have: native  # device role (name or identifier); the simulator answers only its demo object
      read_property: native  # device role serves the Device object; the simulator has none
      read_property_multiple: native
      write_property: native  # priority array on commandable objects
      write_property_multiple: native
      read_range_by_position: native  # sim role; adapter seeds the 36 records
      read_range_by_sequence_number: native  # sim role; CBSIGMA_REJECT_SEQ=1 refuses it
      read_range_by_time: native  # sim role
      cov: native  # both roles; unconfirmed and confirmed
      get_alarm_summary: adapter-shim  # sim role, CBSIGMA_EVENTS=1: the adapter encodes the ACK body
      get_enrollment_summary: unsupported
      get_event_information: adapter-shim  # sim role, CBSIGMA_EVENTS=1; without it the service is rejected
      acknowledge_alarm: native  # sim role; recorded (operation line), SimpleACK
      cov_multiple: unsupported
      messaging_time_sync: native  # sim role; operation line
      messaging_text: native  # sim role, unconfirmed only; ConfirmedTextMessage is rejected
      messaging_private_transfer: native  # sim role, unconfirmed only
      messaging_write_group: native  # sim role; recorded, not asserted
      event_notification_emit: unsupported
      device_communication_control: native  # sim role; acknowledged, not enforced; password "wrong" -> password-failure
      reinitialize_device_warmstart: native  # sim role; SimpleACK, no restart
      segmented_confirmed_request_receive: native  # both roles
      segmentation_fault_injection: native  # sim role: CBSIGMA_DROP_SEG / CBSIGMA_STALL_SEG; a lost segment is never resent
      peer_as_bbmd: native  # sim role, BACNET_BBMD=1: Register-FD (CBSIGMA_FD_NAK=1 refuses), Distribute-Broadcast; no BDT/FDT reads
      bacnet_ipv6: unsupported  # upstream has it; out of scope, go-bacnet is IPv4 BACnet/IP only
      bacnet_sc: unsupported  # upstream has it; out of scope, go-bacnet is IPv4 BACnet/IP only

  - id: ulbios
    image: ghcr.io/otfabric/bacnet-interop-ulbios
    upstream: ulbios/bacnet, Go, MIT (no tags or releases)
    upstream_version: "v0.0.0-20230910233229-227d62272ce9"
    upstream_commit: "227d62272ce9cedcfe47c1621a8cb4e0d2470ee0"
    role: peer-oracle
    since: "0.14.0"
    roles: [device, client]  # device by default; "client" as first argument
    evidence:
      bvlc: native  # Original-Unicast-NPDU and Original-Broadcast-NPDU only; other functions unanswered
      npdu: native  # DNET with an empty DADR only; no SNET/SADR, no network-layer messages (adapter filters them)
      apdu_dispatch: native  # bacnet.Parse; it compares the whole first octet, so the adapter clears segmented-response-accepted first (adapter-shim; ULBIOS_KEEP_SA=1 keeps it)
      confirmed_transactions: adapter-shim  # ulbios has no transaction layer; invoke ID echoed by the adapter (bacnet.NewSACK/NewCACK/NewError fix it to 1)
      segmented_request_receive: unsupported  # no segmentation; a segmented request is unanswered
      segmented_complex_ack_send: unsupported
      fixture_object_model: adapter-shim  # only properties ulbios can encode (REAL, one-octet Enumerated, two-octet Unsigned, object identifier, NULL)
      service_payload_handlers: adapter-shim
      reject_abort_send: unsupported  # no Reject or Abort encoder: what ulbios cannot decode or answer gets no reply (operation line "unanswered")
    capabilities:
      who_is_i_am: adapter-shim  # Who-Is decoded and I-Am encoded by ulbios; range limits read from its tokens by the adapter; services.IAmObjects hard-codes device 321, the adapter replaces that token
      who_has_i_have: unsupported
      read_property: adapter-shim  # ConfirmedReadProperty.Decode (no array index, property identifiers below 256); object type shifted back by two (DecObjectIdentifier); ACK encoded with ulbios' encoders
      read_property_multiple: unsupported
      write_property: adapter-shim  # ConfirmedWriteProperty.Decode takes only ulbios' own REAL+NULL+priority form; a standard request is assigned by the adapter and decoded with objects.Dec*; NULL (relinquish) is undecodable (DecNull)
      write_property_multiple: unsupported
      read_range_by_position: unsupported
      read_range_by_sequence_number: unsupported
      read_range_by_time: unsupported
      cov: unsupported
      get_alarm_summary: unsupported
      get_enrollment_summary: unsupported
      cov_multiple: unsupported
      messaging_time_sync: unsupported
      messaging_text: unsupported
      messaging_private_transfer: unsupported
      messaging_write_group: unsupported
      event_notification_emit: unsupported
      device_communication_control: unsupported
      reinitialize_device_warmstart: unsupported
      segmented_confirmed_request_receive: unsupported
      peer_as_bbmd: unsupported
    client_capabilities:  # docs/CLIENT_DRIVER_CONTRACT.md
      who_is_i_am: native  # bacnet.NewWhois (no limits) and UnconfirmedIAm.Decode; a ranged Who-Is is unsupported
      read_property: native  # bacnet.NewReadProperty (invoke ID 1, no array index, property identifier below 256); REAL by ComplexACK.Decode, Enumerated/Unsigned/object identifier by objects.Dec*; other types not decodable: known-difference
      write_property: native  # bacnet.NewWriteProperty for a REAL without priority or at 16 (REAL followed by NULL, priority 16; refused with invalid-data-type: known-difference); otherwise adapter-shim from objects.Enc* (priority, NULL, Enumerated); no character-string encoder
      who_has_i_have: unsupported
      read_property_multiple: unsupported
      write_property_multiple: unsupported
      subscribe_cov: unsupported
      read_range_by_position: unsupported
      device_communication_control: unsupported
      reinitialize_device: unsupported
      atomic_read_file_stream: unsupported
      atomic_write_file_stream: unsupported
      add_list_element: unsupported
      remove_list_element: unsupported
      create_object: unsupported
      delete_object: unsupported
      get_event_information: unsupported
      acknowledge_alarm: unsupported
      time_synchronization: unsupported
      unconfirmed_private_transfer: unsupported
      write_group: unsupported
      foreign_device_registration: unsupported  # no Register-Foreign-Device; --bbmd is accepted and not used
      read_bdt: unsupported
      read_fdt: unsupported
      write_bdt: unsupported
      segmentation: unsupported
      subscribe_cov_property: unsupported
      subscribe_cov_property_multiple: unsupported
      get_alarm_summary: unsupported
      get_enrollment_summary: unsupported
      text_message: unsupported
      confirmed_private_transfer: unsupported

