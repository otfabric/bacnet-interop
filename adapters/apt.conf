// apt settings for every adapter image build (COPY'd to
// /etc/apt/apt.conf.d/80-otfabric before the first apt-get).
//
// The Debian and Ubuntu mirrors are at times slow or unreachable from CI
// runners: retry each download with apt's back-off instead of failing the
// image build, and give up on a stalled connection after 30 s instead of
// apt's default 120 s, so a retry starts sooner.
Acquire::Retries "5";
Acquire::http::Timeout "30";
Acquire::https::Timeout "30";
