# Machine-readable version manifest of bacnet-interop. The Dockerfiles,
# requirements.txt and pom.xml are the source of truth for a build;
# scripts/check-versions.py (make validate-fixtures) fails when this file
# disagrees with them. Capabilities per peer: adapters/inventory.yaml.
# Dockerfiles pin upstream by commit or by exact package version; the two
# PyPI stacks are also pinned by the sha256 of their wheel (wheel_sha256, pip
# --require-hashes), the Go modules by go.sum and bacnet-js by the integrity
# hashes of package-lock.json. No source archive hash is recorded.
# license_texts is where licenses/ (THIRD_PARTY_NOTICES.md) holds the upstream
# licence texts; scripts/check-versions.py fails when it is missing or empty.
# adapters/cbsigma/go.mod (with go.sum) is the source
# of truth for the two cB-Sigma modules; scripts/check-versions.py fails when
# its Dockerfile ARGs or this file disagree with it. adapters/ulbios/go.mod
# (with go.sum) pins ulbios/bacnet by commit as a Go pseudo-version; the
# Dockerfile ARG ULBIOS_COMMIT repeats it and is cross-checked the same way.

interop_version: "0.16.0"      # equals adapter_version in adapters/inventory.yaml
contract_version: "1.1"        # docs/CONTAINER_CONTRACT.md

protocol:
  name: "BACnet/IP"
  udp_port: 47808

implementations:
  bacnet-stack:
    upstream: "bacnet-stack"
    repository: "https://github.com/bacnet-stack/bacnet-stack"
    version: "1.6.1"
    revision: "7a53f0a72a92de1621d30fc63703a29afe12bfaf"
    license: "GPL-2.0-or-later WITH GCC-exception-2.0"   # per-file; see license/ upstream
    license_texts: "licenses/bacnet-stack"
    roles: [device, bbmd]
    published: true
    pinned_in:
      - adapters/bacnet-stack/Dockerfile
  bacnet-stack-router:
    upstream: "bacnet-stack apps/router"
    repository: "https://github.com/bacnet-stack/bacnet-stack"
    version: "1.6.1"
    revision: "7a53f0a72a92de1621d30fc63703a29afe12bfaf"
    license: "MIT"                                       # apps/router, adapters/bacnet-stack-router/README.md
    license_texts: "licenses/bacnet-stack"
    roles: [router]
    published: true
    pinned_in:
      - adapters/bacnet-stack-router/Dockerfile
  bacpypes3:
    upstream: "BACpypes3"
    repository: "https://github.com/JoelBender/BACpypes3"
    version: "0.0.110"
    wheel_sha256: "02abc0c9e7e92d7061727898ba00204ec072f1d451a63c4e7de76015b5b14911"   # py3-none-any, the only wheel of the release
    upstream_commit: "48beeba05712750615570afebaf904ecc778830d"   # tag v0.0.110
    license: "MIT"                                       # pyproject.toml license expression; no licence file upstream
    license_texts: "licenses/bacpypes3"
    roles: [device, bbmd]
    published: true
    pinned_in:
      - adapters/bacpypes3/Dockerfile
      - adapters/bacpypes3/requirements.txt
  bacpypes:
    upstream: "BACpypes (legacy, PyPI bacpypes; not BACpypes3)"
    repository: "https://github.com/JoelBender/bacpypes"
    version: "0.19.0"                                    # untagged on GitHub; the last tag is v0.18.6
    wheel_sha256: "317fbe440474845978dab134f8aefb5f45a41a13926cbdf87b9b8afe6e79131b"   # the only file of the release
    upstream_commit: "86288e64faa596111d1eb284c3b36a7e37d6272f"   # py34/bacpypes at this commit equals the wheel's bacpypes/ (also at a7f2f41 and master e59ea3c)
    license: "MIT"                                       # LICENSE in the wheel; METADATA also has a BSD classifier
    license_texts: "licenses/bacpypes"
    roles: [device, bbmd, client]
    published: true
    pinned_in:
      - adapters/bacpypes/Dockerfile
      - adapters/bacpypes/requirements.txt
  bacnet4j:
    upstream: "BACnet4J"
    repository: "https://github.com/RadixIoT/BACnet4J"
    version: "6.1.1"
    license: "GPL-3.0"
    license_texts: "licenses/bacnet4j"
    roles: [device, bbmd]
    published: true
    pinned_in:
      - adapters/bacnet4j/Dockerfile
      - adapters/bacnet4j/pom.xml
  sysiobacnet:
    upstream: "System.IO.BACnet (NuGet BACnet)"
    repository: "https://github.com/ela-compil/BACnet"
    version: "4.0.0"
    revision: "af0e6c08b3888b18da8a3f0c9af540e2744e4f6e"
    license: "MIT"
    license_texts: "licenses/sysiobacnet"
    roles: [device]
    published: true
    pinned_in:
      - adapters/sysiobacnet/Dockerfile
      - adapters/inventory.yaml
  worldiety:
    upstream: "worldiety/bacnet"
    repository: "https://github.com/worldiety/bacnet"
    revision: "3cb2aa80efbb8a489abb9978c7f6e5dc603535a7"
    license: "BSD-2-Clause"
    license_texts: "licenses/worldiety"
    roles: [device]
    published: true
    pinned_in:
      - adapters/worldiety/Dockerfile
  cbsigma:
    upstream: "cB-Sigma bacnet (device role)"
    repository: "https://github.com/cB-Sigma/bacnet"
    module: "github.com/cB-Sigma/bacnet"
    version: "v0.2.0"                                    # tag; also links cB-Sigma/tlsx v0.6.0, coder/websocket v1.8.15
    upstream_commit: "43314a7b2979e86e55b759fbc6b32a587dcc1a37"
    license: "Apache-2.0"
    license_texts: "licenses/cbsigma"
    language: "Go"
    independent_engine: true
    roles: [device]                                      # CBSIGMA_ROLE=device (default)
    published: true
    pinned_in:
      - adapters/cbsigma/go.mod
      - adapters/cbsigma/Dockerfile
  cbsigma-sim:
    upstream: "cB-Sigma bacnet-sim (simulated device)"
    repository: "https://github.com/cB-Sigma/bacnet-sim"
    module: "github.com/cB-Sigma/bacnet-sim"
    version: "v0.1.0"                                    # tag; built on cB-Sigma/bacnet (v0.2.0 above by MVS)
    upstream_commit: "8ca57e10b4feea721c75a995fd3668af4a037b39"
    license: "Apache-2.0"
    license_texts: "licenses/cbsigma-sim"
    language: "Go"
    independent_engine: true
    roles: [device, bbmd]                                # CBSIGMA_ROLE=sim, in the cbsigma image
    published: true
    pinned_in:
      - adapters/cbsigma/go.mod
      - adapters/cbsigma/Dockerfile
  ulbios:
    upstream: "ulbios/bacnet"
    repository: "https://github.com/ulbios/bacnet"
    module: "github.com/ulbios/bacnet"
    version: "v0.0.0-20230910233229-227d62272ce9"      # Go pseudo-version; no tags or releases upstream
    revision: "227d62272ce9cedcfe47c1621a8cb4e0d2470ee0"  # default branch, 2023-09-10; links no other module
    license: "MIT"
    license_texts: "licenses/ulbios"
    language: "Go"
    independent_engine: true
    roles: [device, client]
    published: true
    pinned_in:
      - adapters/ulbios/go.mod
      - adapters/ulbios/Dockerfile
  bacnet-js:
    upstream: "@bacnet-js/client (npm)"
    repository: "https://github.com/bacnet-js/client"
    module: "@bacnet-js/client"
    version: "3.3.2"                                     # npm package version
    upstream_commit: "43fbd9228dbf03a72fb8b7d2d01aee3b1fe96734"   # npm gitHead; tag v3.3.2 = 27a399a00a7057ebb1d844bd6431d25af383c7ad (same src)
    license: "MIT"                                       # also debug 4.4.3, ms 2.1.3, iconv-lite 0.6.3, safer-buffer 2.1.2 (MIT)
    license_texts: "licenses/bacnet-js"
    language: "TypeScript (Node.js)"
    independent_engine: true
    roles: [device, client]                              # device mode (default) and client mode
    published: true
    pinned_in:
      - adapters/bacnet-js/package.json
      - adapters/bacnet-js/package-lock.json
      - adapters/bacnet-js/Dockerfile
  bip-router:
    upstream: "none (written for the tests, a topology aid)"
    version: "topology-router-v1"
    license: "MIT"
    license_texts: "LICENSE"   # this repository's licence (no upstream)
    roles: [topology-aid]
    published: true
    pinned_in:
      - adapters/inventory.yaml

base_images:
  debian: "docker.io/library/debian:bookworm-slim@sha256:7b140f374b289a7c2befc338f42ebe6441b7ea838a042bbd5acbfca6ec875818"
  temurin_jdk: "docker.io/library/eclipse-temurin:17-jdk-jammy@sha256:723151f3fc88ca2060153ee08ab8dbbea7983d6ed6f2622fe440acf178737c94"
  temurin_jre: "docker.io/library/eclipse-temurin:17-jre-jammy@sha256:475d8e96b4b2bfe08999e5e854755c773af1581acdf959a4545d88f0696a2339"
  dotnet_sdk: "mcr.microsoft.com/dotnet/sdk:10.0@sha256:e70cdb7f80b0348f5cb85f19a8f670fca061f033d57eed12fa003d58b0e06317"
  dotnet_runtime: "mcr.microsoft.com/dotnet/runtime:10.0@sha256:b89586dc17781f25531909993658aa8161205ae38b8cec8847df4a8221a403d5"
  golang: "docker.io/library/golang:1.26-bookworm@sha256:23ce71337b726608afb1bc00986e630a05034a87a87ea1fc2cd1ae5cf33387eb"
  node: "docker.io/library/node:24.22.2-bookworm-slim@sha256:01d566e8d94d8c619591d78652babfccd3c6992a3dffa9ed5ab39e11cf6c70e9"   # bacnet-js
  golang_1_27: "docker.io/library/golang:1.27.2-trixie@sha256:e58d6f83b3416618d8bcac2b3dde1b7f7e3c4a77d25e88637f8bbae81536c48d"   # cbsigma (the modules need Go 1.27.1)
  python_slim: "docker.io/library/python:3.12-slim@sha256:5e2bdb1b0d542d5039cffb8181c65930093949194a65c365dfb1b0fe13a4fa5b"   # the results validator in .github/workflows/ci.yml

# The image of go-bacnet, our own stack (own/go-bacnet/README.md). Not a
# reference: not in a harness release, not in manifest.json, not pinned here.
# Built by hand from the latest go-bacnet release; results against it are at
# most Tested (independent_engine: false).
own_implementations:
  otfabric:
    upstream: "go-bacnet"
    repository: "https://github.com/otfabric/go-bacnet"
    artifact: "go:github.com/otfabric/go-bacnet"
    version: "latest release, resolved when the image is built by hand"
    license: "MIT"
    language: "Go"
    independent_engine: false
    roles: [device, client, bbmd]
    image: "ghcr.io/otfabric/bacnet-interop-otfabric"
    build: "own/go-bacnet"
